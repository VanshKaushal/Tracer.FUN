[workspace]
members = ["crates/trace-core", "crates/trace-metrics", "crates/trace-storage", "crates/trace-ipc", "crates/trace-agent", "apps/desktop/src-tauri"]
default-members = ["crates/trace-agent", "crates/trace-metrics", "crates/trace-storage", "crates/trace-ipc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Power"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

